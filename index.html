<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Antigravity Deck</title>
  <style>
    body { background:#09090b; color:#f4f4f5; font-family:system-ui,sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; margin:0; text-align:center; padding:20px; }
    .spinner { width:36px; height:36px; border:3px solid #27272a; border-top-color:#a855f7; border-radius:50%; animation:spin .8s linear infinite; margin-bottom:16px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    a { color:#a855f7; text-decoration:none; margin-top:12px; display:inline-block; padding:10px 18px; border:1px solid #3f3f46; border-radius:8px; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div id="msg">Đang kết nối vào Antigravity Deck trên máy tính...</div>
  <div id="links"></div>
  <script>
    (async () => {
      try {
        const res = await fetch('https://api.github.com/gists/=' + Date.now(), { cache: 'no-store' });
        const data = await res.json();
        const info = JSON.parse(data.files['tunnel.json'].content);
        if (info.url) {
          window.location.replace(info.url);
          document.getElementById('links').innerHTML = '<a href="' + info.url + '">Bấm vào đây nếu không tự chuyển (4G/5G)</a><br><a href="' + info.lan + '">Mở qua Wi-Fi LAN (' + info.lan + ')</a>';
        }
      } catch (e) {
        document.getElementById('msg').innerText = 'Không lấy được link tự động: ' + e.message;
      }
    })();
  </script>
</body>
</html>
